<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <h1>Cursor 账号</h1>
          <p class="brand-sub">Account Launcher</p>
        </div>
        <span class="pill ok" id="loginPill">检测中</span>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="btnRefreshAll">刷新全部</button>
        <button class="btn primary" id="btnLaunchLocal">启动 IDE</button>
      </div>
    </header>

    <section class="toolbar card">
      <input id="searchInput" type="search" placeholder="搜索邮箱、备注…" />
      <select id="filterGroup"><option value="">全部分组</option></select>
      <select id="filterTag"><option value="">全部标签</option></select>
      <select id="filterPlan">
        <option value="">全部套餐</option>
        <option value="ultra">Ultra</option>
        <option value="pro">Pro</option>
        <option value="free">Free</option>
        <option value="trial">Trial</option>
      </select>
      <button class="btn primary" id="btnAddOpen">添加账号</button>
      <button class="btn ghost" id="btnDetect">探测本机</button>
      <button class="btn ghost" id="btnSelectAll">全选</button>
      <button class="btn ghost" id="btnExport">导出</button>
    </section>

    <section class="accounts-wrap">
      <div class="acc-grid" id="accGrid"></div>
      <p class="empty" id="emptyAccounts">还没有账号。点「添加账号」或「探测本机」导入当前 Cursor 登录。</p>
    </section>

    <details class="card settings-fold">
      <summary>代理与 Cursor 路径</summary>
      <div class="settings-grid">
        <section class="settings-panel">
          <h3 class="settings-title">网络代理</h3>
          <label class="check-row"><input type="checkbox" id="proxyEnabled" checked /> 启用代理</label>
          <label class="check-row"><input type="checkbox" id="proxyOnLaunch" /> 启动 IDE 时自动注入</label>
          <p class="hint settings-hint">默认关闭。勾选后每次启动会写入 settings.json；不影响 Cursor 网关插件的线路设置。</p>
          <label class="field-label" for="proxyType">地址</label>
          <div class="proxy-fields">
            <select id="proxyType" aria-label="代理类型"><option value="http">HTTP</option><option value="socks5">SOCKS5</option></select>
            <input id="proxyHost" value="127.0.0.1" spellcheck="false" aria-label="代理主机" />
            <input id="proxyPort" type="number" value="7890" min="1" max="65535" aria-label="代理端口" />
          </div>
          <button type="button" class="btn" id="btnSaveProxy">保存并注入</button>
        </section>
        <section class="settings-panel">
          <h3 class="settings-title">Cursor 安装路径</h3>
          <label class="field-label" for="cursorPath">可执行文件</label>
          <input id="cursorPath" spellcheck="false" placeholder="留空则自动检测 Cursor.exe" />
          <button type="button" class="btn" id="btnSavePath">保存路径</button>
          <pre class="mini" id="cursorInfo">—</pre>
        </section>
      </div>
    </details>
  </div>

  <dialog id="addDialog" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <h2>添加账号</h2>
          <p class="hint">支持 access_token；设备管理需 ws token（user_xxx::eyJ…）</p>
        </div>
        <button type="button" class="icon-btn modal-close" id="btnAddCancel" aria-label="关闭">×</button>
      </div>
      <label class="field-label">Token</label>
      <textarea id="tokenInput" spellcheck="false" placeholder="每行一个 token，或整段 Cookie"></textarea>
      <div class="field-grid">
        <div>
          <label class="field-label">邮箱</label>
          <input id="addEmail" placeholder="可选" spellcheck="false" />
        </div>
        <div>
          <label class="field-label">密码</label>
          <input id="addPassword" type="password" placeholder="本地加密保存" />
        </div>
        <div>
          <label class="field-label">分组</label>
          <input id="addGroup" placeholder="未分组" spellcheck="false" />
        </div>
        <div>
          <label class="field-label">标签</label>
          <input id="addTags" placeholder="逗号分隔" spellcheck="false" />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="btnImport">从文件导入</button>
        <button type="button" class="btn ghost" id="btnAddCancel2">取消</button>
        <button type="button" class="btn primary" id="btnAdd">添加</button>
      </div>
    </div>
  </dialog>

  <dialog id="detailDialog" class="modal">
    <div class="modal-box detail-box">
      <div class="modal-head">
        <h2>账号详情</h2>
        <button type="button" class="icon-btn modal-close" id="detailClose">×</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnDetailDevices">登录设备</button>
        <button type="button" class="btn primary" id="btnDetailSwitch">切换并启动</button>
        <button type="button" class="btn ghost" id="btnDetailSyncWs">同步本机 WS</button>
        <button type="button" class="btn" id="btnDetailSave">保存</button>
        <button type="button" class="btn ghost" id="btnDetailRefresh">刷新额度</button>
      </div>
    </div>
  </dialog>

  <dialog id="devicesDialog" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>登录设备 <span class="badge" id="sessionCount">0</span></h2>
        <button type="button" class="icon-btn modal-close" id="devicesClose">×</button>
      </div>
      <p class="hint" id="guardHint">自动保护本机 Web + Desktop</p>
      <section class="guard-panel card">
        <div class="guard-head">
          <h3>会话守卫</h3>
          <span class="guard-status" id="guardStatus">未启用</span>
        </div>
        <label class="check-row"><input type="checkbox" id="guardEnabled" /> 启用定时巡检</label>
        <div class="guard-fields">
          <label class="field-label" for="guardMode">模式</label>
          <select id="guardMode">
            <option value="whitelist">保留名单（踢未勾选）</option>
            <option value="auto_kick">自动踢新设备</option>
          </select>
          <label class="field-label" for="guardInterval">间隔（分钟）</label>
          <input id="guardInterval" type="number" min="1" max="120" value="5" />
        </div>
        <div class="guard-actions">
          <button type="button" class="btn" id="btnSaveGuard">保存守卫</button>
          <button type="button" class="btn ghost" id="btnRunGuard">立即巡检</button>
        </div>
        <p class="hint guard-note" id="guardModeHint">勾选下方设备为保留名单；定时踢掉未勾选的会话。</p>
      </section>
      <div class="kick-bar">
        <button class="btn danger" id="btnKickOthers">踢掉其它设备</button>
        <span class="kick-summary" id="kickSummary"></span>
      </div>
      <p class="session-error hint" id="sessionLoadError" hidden></p>
      <div class="device-list" id="sessionBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="btnRefreshSessions">刷新</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
